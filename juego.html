<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎮 Juego Lavandas Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    radial-gradient(circle at top,#312e81 0%,#0f172a 40%,#020617 100%);
    color:white;
    min-height:100vh;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    background:rgba(15,23,42,.8);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:30px;
    font-weight:700;
}

.back-btn{
    text-decoration:none;
    color:white;
    padding:12px 25px;
    border-radius:15px;
    background:linear-gradient(to right,#22c55e,#16a34a);
    font-weight:700;
    transition:.3s;
}
.back-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(34,197,94,.4);
}

.hero{
    text-align:center;
    padding:50px 20px;
}

.hero h1{
    font-size:60px;
    margin-bottom:15px;
}

.hero span{
    background:linear-gradient(to right,#22c55e,#c084fc);
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:#cbd5e1;
    font-size:18px;
}

.container{
    display:flex;
    justify-content:center;
    padding:20px;
}

.game-card{
    background:rgba(17,24,39,.75);
    backdrop-filter:blur(18px);
    border-radius:30px;
    padding:30px;
    text-align:center;
    box-shadow:0 25px 50px rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.08);
}

.game-header h2{
    font-size:34px;
    margin-bottom:20px;
}

canvas{
    border:4px solid red;
    border-radius:20px;
    background:black;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}
#mensaje{
    margin-top:20px;
    font-size:26px;
    font-weight:bold;
}

#restart{
    margin-top:20px;
    padding:15px 30px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:linear-gradient(
    to right,
    #22c55e,
    #c084fc
    );
    color:white;
    font-size:18px;
    font-weight:700;
    display:none;
    transition:.3s;
}

#restart:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(192,132,252,.4);
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.15);
}

100%{
transform:scale(1);
}

}

</style>

</head>

<body>

<nav>
    <div class="logo">
        🎮 Juego Lavandas
    </div>

    <a href="index.html" class="back-btn">
        ⬅ Volver
    </a>

</nav>

<section class="hero">

    <h1>
        🏆 Desafío <span>Lavandas</span>
    </h1>

    <p>
        Esquiva los obstáculos y consigue 20 puntos para ganar.
    </p>

</section>

<div class="container">

    <div class="game-card">

        <div class="game-header">

            <h2>
                🌿 Puntos:
                <span id="score">0</span>
            </h2>

        </div>

        <canvas
        id="game"
        width="400"
        height="600">
        </canvas>

        <div id="mensaje"></div>

        <button id="restart">
            🔄 Volver a jugar
        </button>

    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const birdImg = new Image();
const fondoImg = new Image();
const tuboImg = new Image();

birdImg.src = "./pajaro.png";
fondoImg.src = "./fondo1.jpg";
tuboImg.src = "./tubo.png";

const scoreText =
document.getElementById("score");

const mensaje =
document.getElementById("mensaje");

const restartBtn =
document.getElementById("restart");

let bird;
let pipes;
let score;
let gameOver;
let gameWon;
let fondoX = 0;

function iniciarJuego(){

    bird = {
        x:80,
        y:250,
        width:60,
        height:60,
        velocity:0
    };

    pipes = [];
    score = 0;

    gameOver = false;
    gameWon = false;

    scoreText.textContent = score;

    mensaje.textContent = "";

    restartBtn.style.display = "none";

    crearTubo();

}
function crearTubo(){

    let gap = 140;

    let topHeight =
    Math.random() * 250 + 50;

    pipes.push({

        x:canvas.width,

        width:70,

        top:topHeight,

        bottom:
        canvas.height -
        topHeight -
        gap,

        passed:false

    });

}

document.addEventListener(
"keydown",
e=>{

    if(e.code==="Space"){

        bird.velocity = -8;

    }

});

canvas.addEventListener(
"click",
()=>{

    bird.velocity = -8;

});

function update(){

if(gameOver || gameWon)
return;

fondoX -= 1;

if(fondoX <= -canvas.width){

    fondoX = 0;

}
bird.velocity += 0.5;

bird.y += bird.velocity;

if(bird.y < 0){

    bird.y = 0;

}

if(
bird.y + bird.height >
canvas.height
){

    terminarJuego();

}

pipes.forEach(pipe=>{

    pipe.x -= 5;

    const margen = 12;
    const tubeMargin = 8;

    const birdLeft =
    bird.x + margen;

    const birdRight =
    bird.x +
    bird.width -
    margen;

    const birdTop =
    bird.y + margen;

    const birdBottom =
    bird.y +
    bird.height -
    margen;

    if(

        birdRight >
        pipe.x +
        tubeMargin &&

        birdLeft <
        pipe.x +
        pipe.width -
        tubeMargin &&

        (

        birdTop <
        pipe.top ||

        birdBottom >
        canvas.height -
        pipe.bottom

        )

    ){

        terminarJuego();

    }
        if(

        !pipe.passed &&

        bird.x >
        pipe.x +
        pipe.width

    ){

        pipe.passed = true;

        score++;

        scoreText.textContent =
        score;

        if(score >= 20){

            ganarJuego();

        }

    }

});

pipes = pipes.filter(
pipe =>
pipe.x > -pipe.width
);

if(

    pipes.length === 0 ||

    pipes[
    pipes.length - 1
    ].x < 220

){

    crearTubo();

}

}

function draw(){

if(

    fondoImg.complete &&

    fondoImg.naturalWidth

){

    ctx.drawImage(

        fondoImg,

        fondoX,

        0,

        canvas.width,

        canvas.height

    );
        ctx.drawImage(

        fondoImg,

        fondoX +
        canvas.width,

        0,

        canvas.width,

        canvas.height

    );

}else{

    ctx.fillStyle =
    "#87CEEB";

    ctx.fillRect(

        0,
        0,

        canvas.width,

        canvas.height

    );

}

if(

    birdImg.complete &&

    birdImg.naturalWidth

){

    ctx.save();

    ctx.translate(

        bird.x +
        bird.width / 2,

        bird.y +
        bird.height / 2

    );

    ctx.rotate(

        bird.velocity *
        0.05

    );
        ctx.drawImage(

        birdImg,

        -bird.width / 2,

        -bird.height / 2,

        bird.width,

        bird.height

    );

    ctx.restore();

}

particles.forEach(p=>{

    p.x -= p.speed;

    if(p.x < -10){

        p.x =
        canvas.width + 10;

        p.y =
        Math.random() *
        canvas.height;

    }

    ctx.fillStyle =
    "rgba(255,255,255,.3)";

    ctx.beginPath();

    ctx.arc(

        p.x,

        p.y,

        p.size,

        0,

        Math.PI * 2

    );

    ctx.fill();

});

pipes.forEach(pipe=>{

    if(

        tuboImg.complete &&

        tuboImg.naturalWidth

    ){        ctx.drawImage(

            tuboImg,

            pipe.x,

            0,

            pipe.width,

            pipe.top

        );

        ctx.drawImage(

            tuboImg,

            pipe.x,

            canvas.height -
            pipe.bottom,

            pipe.width,

            pipe.bottom

        );

    }else{

        ctx.fillStyle =
        "green";

        ctx.fillRect(

            pipe.x,

            0,

            pipe.width,

            pipe.top

        );

        ctx.fillRect(

            pipe.x,

            canvas.height -
            pipe.bottom,

            pipe.width,

            pipe.bottom

        );

    }

});

}

function terminarJuego(){

    gameOver = true;
        mensaje.innerHTML =
    "💀 Game Over";

    restartBtn.style.display =
    "inline-block";

}

function ganarJuego(){

    gameWon = true;

    mensaje.innerHTML =

    `
    <div style="
    font-size:42px;
    animation:pulse 1s infinite;
    color:#22c55e;
    ">
    🏆 ¡GANASTE!
    </div>

    <div style="
    font-size:22px;
    margin-top:10px;
    ">
    🎁 Barra gratis de lavanda
    </div>
    `;

    restartBtn.style.display =
    "inline-block";

}

const particles = [];

for(

    let i = 0;

    i < 30;

    i++

){

    particles.push({

        x:
        Math.random() *
        canvas.width,
                y:
        Math.random() *
        canvas.height,

        size:
        Math.random() * 4 + 2,

        speed:
        Math.random() * 1 + 0.2

    });

}

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}

restartBtn.addEventListener(

    "click",

    ()=>{

        iniciarJuego();

    }

);

iniciarJuego();

loop();

</script>

</body>

</html>
